<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Realistic Metallic Chrome Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Deep Blue Core Gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>

    <!-- Glassy Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="50" cy="50" r="48" fill="url(#coreGrad)" stroke="#334155" stroke-width="0.5" />

  <!-- Realistic Spinning Gear -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="12s" repeatCount="indefinite" />
    <path d="M50 15 L53 22 L60 22 L63 15 L72 18 L70 25 L76 29 L82 25 L85 33 L78 37 L80 44 L87 47 L87 53 L80 56 L78 63 L85 67 L82 75 L76 71 L70 75 L72 82 L63 85 L60 78 L53 78 L50 85 L41 82 L43 75 L37 71 L31 75 L28 67 L35 63 L33 56 L26 53 L26 47 L33 44 L35 37 L28 33 L31 25 L37 29 L43 25 L41 18 Z" 
          fill="url(#chromeGrad)" />
    <circle cx="50" cy="50" r="28" fill="url(#coreGrad)" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Realistic Car Icon -->
  <g transform="translate(30, 38) scale(0.4)">
    <path d="M10 50 L20 30 C25 20, 75 20, 80 30 L90 50 L95 50 C98 50, 98 60, 95 60 L5 60 C2 60, 2 50, 5 50 Z" fill="#ffffff">
       <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
    </path>
    <rect x="25" y="55" width="10" height="10" rx="5" fill="#3b82f6" />
    <rect x="65" y="55" width="10" height="10" rx="5" fill="#3b82f6" />
  </g>

  <!-- Glass Top Overlay -->
  <circle cx="50" cy="50" r="48" fill="url(#glassReflect)" pointer-events="none" />
</svg>
