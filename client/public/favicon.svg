<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Spinning Gear -->
  <g filter="url(#glow)">
    <path d="M50 20 L55 25 L65 25 L70 20 L80 30 L75 35 L75 45 L80 50 L70 60 L65 60 L55 65 L50 70 L45 65 L35 60 L30 60 L20 50 L25 45 L25 35 L20 30 L30 20 L35 25 L45 25 Z" 
          fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Inner Pulsing Car Silhouette -->
  <path d="M30 60 L35 55 L65 55 L70 60 L75 60 L75 65 L25 65 L25 60 Z M35 55 L40 45 L60 45 L65 55 Z" 
        fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Moving Light Effect -->
  <circle cx="0" cy="0" r="2" fill="white">
    <animateMotion path="M20 20 L80 80 M80 20 L20 80" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
